[package]
name = "forge-workspace"
version = "0.1.0"
description = "Forge Workspace — desktop app for orchestrating coding agents in isolated git worktrees"
authors = ["Kaushik"]
edition = "2021"
rust-version = "1.77"

# See https://tauri.app/v1/api/config/#buildconfig for the build script config
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rusqlite_migration = "1"

# Native folder picker for "Open an existing repository" / "Create a new project"
tauri-plugin-dialog = "2"

# HTTP client for the Anthropic Messages API (M6). rustls-tls (pure Rust,
# no OpenSSL/schannel system dependency) rather than the default-tls feature
# — `default-features = false` avoids pulling in native-tls alongside it,
# and `AnthropicClient::new` calls `.use_rustls_tls()` explicitly so the
# rustls backend is actually used regardless of any other crate's feature
# unification pulling default-tls back in.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Streaming combinator (`.next()`) over `reqwest::Response::bytes_stream()`
# in the Anthropic SSE client.
futures-util = "0.3"

# Glob (`search_files`) and basic-regex (`search_code`) matching for the
# agent's filesystem search tools (M6).
regex = "1"

# Cooperative cancellation for a running agent loop (M6) — `stop_agent_run`
# flips this and both the in-flight HTTP stream read and any in-flight
# `run_command` child process are torn down promptly rather than left to run
# to completion. Chosen over a hand-rolled `Arc<AtomicBool>` because
# `CancellationToken::cancelled()` is itself an awaitable future, so it drops
# straight into `tokio::select!` alongside the stream/process reads instead
# of needing to be polled.
tokio-util = "0.7"

# Identifiers & timestamps
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# OS keychain access for API keys (M4). Native backends are opt-in features
# per platform; only the two CI/target platforms are enabled (no Linux
# desktop target yet).
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Cross-platform PTY for the Terminal tab (M3)
portable-pty = "0.8"

# Encodes raw PTY output bytes for the `terminal:output` event payload (PTY
# output isn't guaranteed to be valid UTF-8 on its own).
base64 = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "forge-workspace"
path = "src/main.rs"

[lib]
name = "forge_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
